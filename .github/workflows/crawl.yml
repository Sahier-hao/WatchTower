name: 定时爬取

on:
  schedule:
    # 北京时间 06:00-23:00 每小时运行一次（UTC 22:00-15:00）
    # 北京时间 00:00-05:00 不运行（夜间停止）
    - cron: "0 22-23,0-15 * * *"
  # 支持手动触发
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install httpx beautifulsoup4 lxml

      - name: 运行爬虫
        working-directory: backend
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python standalone_crawl.py

