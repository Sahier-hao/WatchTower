name: 定时爬取

on:
  schedule:
    # 每30分钟运行一次 (UTC时间，每小时的0分和30分)
    - cron: "*/30 * * * *"
  # 支持手动触发
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install httpx beautifulsoup4 lxml

      - name: 运行爬虫
        working-directory: backend
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python standalone_crawl.py
